# 机械臂配置:JAKA Zu 20(控制柜 1.7.2)。
#
# 单位:位置 mm、角度 °、关节速度 °/s;关节段写占最大关节速度的百分比。
# 真机上的速度:`[speed] program_sets_speed = true` 时按演示配置里的速度发给控制柜,再乘
# 示教器上的速度倍率;false 时程序设的速度到不了控制柜,快慢全看示教器(见 [speed])。
#
# 不指定机械臂配置时用的就是这一份,而且只在仿真里动;要连真机必须加开关并显式指定
# (第 05 票)。

name = "JAKA Zu 20"
robot_name = "JAKA Zu20"      # 工作站 model/demo-station.rdk 里这台机械臂的名字

[connection]
driver = "robodk"             # 经 RoboDK 驱动;仿真时用不到下面的 ip
ip = ""                       # 控制柜 IP,连真机时填;空着就只能跑仿真
power_check = "jaka_jkrc"     # 上电使能只查不做:经 RoboDK 自带的 Python 用 jkrc 读状态位

# 工作台坐标系:相对底座绕 Z 轴转过的角度,加上可选的原点平移(默认 0)。
#
# 90° 不是量出来的,是 ** 定出来的 ** (2026-09-22,用户在现场给的布置):操作者站在
# 机械臂 ** 基座 +X 的前方 ** 。而演示配置里工作台坐标系的约定是「+X 指操作者右手边、
# +Y 远离操作者」,也就是操作者在工作台 −Y 上。要让工作台 −Y 对上基座 +X,就得绕 Z
# 转 90°。由此:工作台 +X = 基座 +Y = 操作者的右手边。
#
# 这一台因此不用跑标定小脚本 —— 基座轴的定义比任何一次摆位都准。换了布置(基座转了、
# 操作位挪了)再跑 calibrate_worktable。
[worktable]
angle_deg = 90.0
origin_mm = [0.0, 0.0, 0.0]

# 待命位姿:2026-09-22 用户在示教器上把真机摆到这个位姿,定为 Home;前五轴是从控制柜
# 读回来的(和示教器显示的差 0.001°,就是显示的舍入)。
#
# ** J6 比用户摆的那个值转了 −30.233° ** (原值 −52.043)。这不是改布置:J6 绕的就是
# 法兰自己的轴,而法兰原点就在这根轴上,所以转它 ** 法兰位置一点不变 ** (实测 0.000000 mm),
# 指针是一根杆,绕自己转 30° 在现场看不出区别。
#
# 为什么非转不可:2026-09-22 真机实测发现,经 RoboDK 的 JAKA 驱动下发直线运动时,
# 姿态会被镜像 —— `(RX, RY, RZ)` 执行成 `(RX, −RY, −RZ)`(见 notes)。而 `RY = 0、
# RZ = 0` 是这个镜像的 ** 不动点 ** :0 取反还是 0。转过这 −30.233° 之后,Home 在基坐标系
# 里是 RX=−179.335 RY=0.091 RZ=0.000,六个动作全程都停在这个不动点上,镜像就伤不到。
#
# 待命点(法兰,工作台坐标系)(−66.3, −902.1, 849.8) mm —— 离操作者 902 mm,指针尖端
# 离地约 1.07 m(底座在 0.5 m 台子上)。
#
# 原来那组 [118.09, 81.83, 131.94, 236.22, 90.00, 28.09] 是 2026-09-20 在仿真里按
# 「法兰落在 (0, −400, 550)」反解出来的,已作废:它是算出来的,这一组是现场摆出来的。
# Nova 5 那份仍是老的待命点,两台不再共用同一个待命点(路点偏移仍然共用)。
[standby]
joints_deg = [187.723, 90.782, 98.739, 80.480, -89.329, -82.276]

# 指针偏移:控制柜工具 1 里示教好的值(2026-09-20 第一次上 JAKA 读到)。
# 不参与位置计算:控制器保持工具 0,路点按法兰(ADR-0013)。只用来算关节运动时指针
# 尖端走多远,好把关节速度换算成和直线段一样的尖端速度(`robot_side.executor.settle`)。
[pointer]
offset_mm = [1.11, -1.26, 280.47]

[speed]
max_joint_degs = 30.0         # 关节速度上限:程序发出去的不超过它(再乘示教器上的倍率)
max_linear_mms = 100.0        # 直线速度上限(同上)
return_joint_percent = 33.3   # 算不出尖端走多远时回待命的关节速度:30 °/s 的 33.3% ≈ 10 °/s

# 连着真机时把程序设的速度真的发给控制柜。
#
# RoboDK 原来的 JAKA 驱动每收到一行指令都把速度重置成关节 100 °/s、直线 100 mm/s
# (2026-09-23 反编译 v310/JakaDriver.pyc 看到的),程序设的速度到不了控制柜,实际速度
# 一直是 100 × 示教器倍率——关节 13 °/s 落到伸出去一米的法兰上每秒一两百毫米,所以回待命、
# 点头看着比左右上下快得多。true 时换成包过的驱动(robot_side/drivers/jaka_keep_speed.py),
# 每段按演示配置里的速度走:直线段就是 speed_mms,关节段按指针尖端走同样快现算。
# 实际速度 = 这些数 × 示教器倍率:演示配置写 50 mm/s、倍率 25% 时约 12.5 mm/s。
#
# ** 2026-09-23 只在仿真和离线测试里验过,还没上真机。** 上真机先跑
# robot_side.scripts.speed_check 核对速度真的受控。
program_sets_speed = true
